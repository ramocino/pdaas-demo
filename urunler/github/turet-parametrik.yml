name: Parametrik Dosyaları Türet

# Master dosyalar değişince otomatik çalışır
on:
  push:
    branches: [main]
    paths:
      - 'gtip/fasil/**.json'         # Master GTİP dosyaları
      - 'scripts/turet.js'            # Türetme motoru güncellenirse
  pull_request:
    paths:
      - 'gtip/fasil/**.json'
  workflow_dispatch:                  # Manuel tetikleme

jobs:
  turet:
    name: Master → Parametrik Türet
    runs-on: ubuntu-latest

    steps:
      # 1. Repoyu çek
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js kur
      - name: Node.js Kurulum
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Türetme motorunu çalıştır
      - name: Parametrik Dosyaları Üret
        run: |
          node scripts/turet.js

      # 4. Değişiklikleri gör
      - name: Değişiklik Kontrolü
        id: degisiklik
        run: |
          if [ -z "$(git status --porcelain parametrik/)" ]; then
            echo "degisiklik_var=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Değişiklik yok"
          else
            echo "degisiklik_var=true" >> $GITHUB_OUTPUT
            echo "📝 Değişiklik var"
            git status --short parametrik/
          fi

      # 5. Değişiklik varsa commit + push
      - name: Commit ve Push
        if: steps.degisiklik.outputs.degisiklik_var == 'true'
        run: |
          git config user.name "TC-PVS Bot"
          git config user.email "bot@pvs.ticaret.gov.tr"
          git add parametrik/
          git commit -m "🤖 Otomatik: Parametrik dosyalar güncellendi ($(date +%Y-%m-%d))"
          git push

      # 6. Özet
      - name: Özet
        run: |
          echo "## 📊 Türetme Sonucu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parametre | Kayıt |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          for f in parametrik/*.json; do
            ad=$(basename "$f" .json)
            if [ "$ad" != "manifest" ]; then
              sayi=$(jq -r '.toplam_kayit' "$f")
              echo "| $ad | $sayi |" >> $GITHUB_STEP_SUMMARY
            fi
          done